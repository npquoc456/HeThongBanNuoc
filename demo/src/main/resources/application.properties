# Sửa localhost thành 127.0.0.1 giống code cũ của bạn
# Đảm bảo dùng đúng database MayBanNuoc (nơi đang chứa bảng nhanvien)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/MayBanNuoc

spring.datasource.username=root
spring.datasource.password=123456

# Giữ nguyên các cấu hình này
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect