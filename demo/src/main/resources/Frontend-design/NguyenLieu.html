<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System - Nguyên Liệu</title>
    <style>
        /* RESET & CƠ BẢN */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url('anhnen/anhnen.png') no-repeat center center / cover;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        /* WRAPPER ĐỂ SCALE TỈ LỆ - Kích thước gốc 1440 x 1080 */
        #app-wrapper {
            width: 1440px;
            height: 1080px;
            transform-origin: center;
            position: relative;
        }

        /* BỐ CỤC CHÍNH BẰNG CSS GRID */
        .grid-container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 292px 1099px;
            grid-template-rows: 95px 874px;
            gap: 14px 20px;
            justify-content: center;
            align-content: center;
            grid-template-areas:
                "sidebar topbar"
                "sidebar main";
        }

        /* ĐỊNH DẠNG CHUNG CHO CÁC BẢNG MỜ (FROSTED GLASS) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 4px solid rgba(255, 255, 255, 0.7); 
            border-radius: 20px;
        }

        /* 1. THANH BÊN TRÁI (SIDEBAR) */
        .sidebar {
            grid-area: sidebar;
            width: 292px;
            height: 983px;
            padding: 40px 0 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .sidebar-logo {
            margin-bottom: 25px;
        }
        .sidebar-logo img { width: 140px; }

        .nav-item-dashboad, .nav-item-thanh-toan, .nav-item-tich-diem, .nav-item-nguyenlieu, .nav-item-dangxuat {
            display: flex;
            align-items: center;
            width: 85%;
            padding: 0 20px;
            height: 60px;
            margin: 8px 0;
            border-radius: 15px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            color: #000;
        }
        .nav-item-dashboad img, .nav-item-thanh-toan img, .nav-item-tich-diem img, .nav-item-nguyenlieu img, .nav-item-dangxuat img {
            width: 30px;
            margin-right: 15px;
        }

        /* Menu đang chọn: NGUYÊN LIỆU */
        .nav-active { background: white; }
        .spacer { flex-grow: 1; }

        /* 2. THANH TRÊN CÙNG (TOP BAR) */
        .topbar {
            grid-area: topbar;
            width: 1099px;
            height: 95px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 11px;
        }

        .user-info {
            width: 343px;
            height: 73px;
            background: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 20px;
            font-weight: 600;
            font-size: 16px;
        }
        .time-info {
            margin-left: 35%;
            width: 260px;
            height: 73px;
            background: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            font-size: 16px;
        }

        .btn-other {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-other:hover {
            background: #f0f0f0;
            transform: scale(1.05);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        /* 3. VÙNG NỘI DUNG CHÍNH (NGUYÊN LIỆU) */
        .main-panel {
            grid-area: main;
            width: 1099px;
            height: 874px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 15px; 
            overflow: hidden; /* Cố định panel chính */
        }

        /* LƯỚI 6 CỘT CHO BẢNG NGUYÊN LIỆU */
        .row-grid {
            display: grid;
            grid-template-columns: 140px 300px 120px 120px 150px 1fr; 
            align-items: center;
            width: 100%;
        }

        /* Thanh tiêu đề chứa ô tìm kiếm */
        .data-header-bar {
            width: 100%;
            height: 55px;
            background: white;
            border-radius: 20px;
            padding: 0 20px;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #ccc;
            flex-shrink: 0; /* Đảm bảo thanh tiêu đề không bị bóp méo */
        }

        .header-search {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid #aaa;
            border-radius: 20px;
            padding: 5px 15px;
            height: 40px;
            width: 260px;
        }
        .header-search img { width: 18px; margin-right: 10px; }
        .header-search input { border: none; outline: none; width: 100%; font-size: 15px; background: transparent; }

        /* ĐÃ FIX: Khống chế kích thước tối đa của khung bảng */
        .data-list-container {
            width: 100%;
            flex: 1; /* Chiếm khoảng trống còn lại */
            min-height: 0; /* CHÌA KHÓA FIX TRÀN: Không cho phép nở to hơn cha */
            background: white;
            border-radius: 20px;
            padding: 20px; 
            position: relative;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Cắt phần bị lồi ra khỏi viền bo góc */
        }

        /* ĐÃ FIX: Khu vực danh sách có thể cuộn độc lập bên trong container */
        .data-list {
            flex: 1;
            min-height: 0; /* Bắt buộc để thanh cuộn hoạt động mượt trong WebView */
            overflow-y: auto;
            overflow-x: hidden; 
            padding-bottom: 70px; /* Tránh bị che bởi nút Add */
            padding-right: 5px; /* Để scrollbar không dính sát viền */
        }
        
        /* Làm đẹp thanh cuộn */
        .data-list::-webkit-scrollbar { width: 6px; }
        .data-list::-webkit-scrollbar-track { background: transparent; }
        .data-list::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 10px; }

        .data-item {
            padding: 25px 0 15px 0;
            border-bottom: 2px solid #000; 
            font-size: 16px;
            font-weight: 500;
        }

        .data-item .name { font-weight: bold; }
        
        .action-icons {
            display: flex;
            gap: 20px;
            justify-content: flex-end;
            padding-right: 10px;
        }
        .action-icons img, .action-icons svg {
            width: 26px;
            height: 26px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .action-icons img:active, .action-icons svg:active {
            transform: scale(0.9);
        }

        /* Nút Add lớn góc phải dưới */
        .btn-fab {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 70px;
            height: 70px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-fab:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div class="grid-container">

            <!-- SIDEBAR -->
            <div class="sidebar glass-panel">
                <div class="sidebar-logo">
                    <img src="ICONS/Logoicon.png" alt="Logo">
                </div>
                <div class="nav-item-dashboad" onclick="chuyentrang('Dashboard.html')"><img src="ICONS/Dashboardicon.png" alt="icon"> DASHBOARD</div>
                <div class="nav-item-thanh-toan" onclick="chuyentrang('ThanhToan.html')"><img src="ICONS/ThanhToanicon.png" alt="icon"> THANH TOÁN</div>
                <div class="nav-item-tich-diem" onclick="chuyentrang('TichDiem.html')"><img src="ICONS/TichDiemicon.png" alt="icon"> TÍCH ĐIỂM</div>
                <!-- Menu NGUYÊN LIỆU Đang Chọn -->
                <div class="nav-item-nguyenlieu nav-active" onclick="chuyentrang('NguyenLieu.html')"><img src="ICONS/ingredientsicon.png" alt="icon"> NGUYÊN LIỆU</div>
                <div class="spacer"></div>
                <div class="nav-item-dangxuat" onclick="chuyentrang('KetCa.html')"><img src="ICONS/DangXuaticon.png" alt="icon"> KẾT CA</div>
            </div>

            <!-- TOPBAR -->
            <div class="topbar glass-panel">
                <div class="user-info">
                    <div style="font-weight: lighter;font-size: 18px">ID: <span id="staffid"></span></div>
                    <div style="font-weight: bold; font-size: 22px;">Tên: <span  id="staffname"></span></div>
                </div>
                <div class="time-info">
                    <div style="font-weight: lighter; font-size: 18px;" id="current-date"></div>
                    <div style="font-weight: bold; font-size: 22px; margin-left: 40%;" id="current-time"></div>
                </div>
                <div class="btn-other" style="font-size: 32px;">⚙️</div>
            </div>

            <!-- MAIN PANEL -->
            <div class="main-panel glass-panel">
                
                <div class="data-header-bar row-grid">
                    <span>ID / SĐT</span>
                    <div class="header-search">
                        <img src="ICONS/searchicon.png" alt="Search">
                        <input type="text" id="search-input" placeholder="Nhập ID hoặc tên NLieu" oninput="renderIngredients()">
                    </div>
                    <span>SLượng</span>
                    <span>ĐVị</span>
                    <span>Trạng Thái</span>
                    <span></span> 
                </div>

                <div class="data-list-container">
                    <div class="data-list" id="data-container">
                        <!-- Danh sách nguyên liệu đổ bằng JS -->
                    </div>
                    <img src="ICONS/Addicon.png" class="btn-fab" alt="Add">
                </div>

            </div>
        </div>
    </div>

    <script src="javascript/NguyenLieu.js">
    </script>
</body>
</html>
