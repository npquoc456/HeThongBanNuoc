<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System - Tích Điểm</title>
    <style>
        /* RESET & CƠ BẢN */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url('anhnen.png') no-repeat center center / cover;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        /* WRAPPER ĐỂ SCALE TỈ LỆ - Kích thước gốc 1440 x 1080 */
        #app-wrapper {
            width: 1440px;
            height: 1080px;
            transform-origin: center;
            position: relative;
        }

        /* BỐ CỤC CHÍNH BẰNG CSS GRID */
        .grid-container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 292px 1099px;
            grid-template-rows: 95px 874px;
            gap: 14px 20px;
            justify-content: center;
            align-content: center;
            grid-template-areas:
                "sidebar topbar"
                "sidebar main";
        }

        /* ĐỊNH DẠNG CHUNG CHO CÁC BẢNG MỜ (FROSTED GLASS) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 4px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
        }

        /* 1. THANH BÊN TRÁI (SIDEBAR) */
        .sidebar {
            grid-area: sidebar;
            width: 292px;
            height: 983px;
            padding: 40px 0 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .sidebar-logo {
            margin-bottom: 25px;
        }
        .sidebar-logo img { width: 140px; }

        .nav-item-dashboad, .nav-item-thanh-toan, .nav-item-tich-diem, .nav-item-nguyenlieu, .nav-item-dangxuat {
            display: flex;
            align-items: center;
            width: 85%;
            padding: 0 20px;
            height: 60px;
            margin: 8px 0;
            border-radius: 15px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            color: #000;
        }
        .nav-item-dangxuat img, .nav-item-dashboad img, .nav-item-thanh-toan img, .nav-item-tich-diem img, .nav-item-nguyenlieu img { width: 30px; margin-right: 15px; }
        .nav-active { background: white; }
        .spacer { flex-grow: 1; }

        /* 2. THANH TRÊN CÙNG (TOP BAR) */
        .topbar {
            grid-area: topbar;
            width: 1099px;
            height: 95px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 11px;
        }

        .user-info {
            width: 343px;
            height: 73px;
            background: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 20px;
            font-weight: 600;
            font-size: 16px;
        }

        .btn-other {
            width: 73px;
            height: 73px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 3. VÙNG NỘI DUNG CHÍNH (TÍCH ĐIỂM) */
        .main-panel {
            grid-area: main;
            width: 1099px;
            height: 874px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- ĐIỀU CHỈNH CHÍNH Ở ĐÂY --- */
        /* Grid layout rút gọn khoảng cách giữa các cột để sát nhau hơn */
        .row-grid {
            display: grid;
            /* Phân chia: SĐT (150px) - Tên (250px) - Ngày (150px) - Điểm (100px) - Actions (Phần dư) */
            grid-template-columns: 150px 250px 150px 100px 1fr;
            align-items: center;
            width: 100%;
        }

        /* Thanh tiêu đề chứa ô tìm kiếm */
        .customer-header-bar {
            width: 100%;
            height: 55px;
            background: white;
            border-radius: 20px;
            padding: 0 25px;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #ccc;
        }

        .header-search {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid #aaa;
            border-radius: 20px;
            padding: 5px 15px;
            height: 40px;
            width: 230px; /* Thu nhỏ thanh tìm kiếm lại một xíu */
        }
        .header-search img { width: 18px; margin-right: 10px; }
        .header-search input { border: none; outline: none; width: 100%; font-size: 15px; background: transparent; }

        /* Bảng danh sách */
        .customer-list-container {
            width: 100%;
            flex-grow: 1;
            background: white;
            border-radius: 20px;
            padding: 15px 25px;
            position: relative;
            border: 1px solid #ddd;
            overflow: hidden; /* Ngăn chặn cuộn ngang phát sinh từ viền */
        }

        .customer-list {
            height: 100%;
            max-height: 690px;
            overflow-y: auto;
            overflow-x: hidden; /* Cấm tuyệt đối cuộn ngang */
            padding-right: 10px; /* Chừa chỗ cho thanh cuộn dọc không lẹm vào nội dung */
        }

        /* Dòng hiển thị khách hàng */
        .customer-item {
            padding: 16px 0; /* Thu nhỏ khoảng cách trên dưới so với bản cũ */
            border-bottom: 2px solid #000;
            font-size: 16px;
            font-weight: 500;
        }

        .customer-item .name { font-weight: bold; }
        
        .action-icons {
            display: flex;
            gap: 15px; /* Giảm gap giữa các icon cho gọn */
            justify-content: flex-end; /* Đẩy các icon sát vào lề phải */
        }
        .action-icons img, .action-icons svg {
            width: 24px;
            height: 24px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .action-icons img:active, .action-icons svg:active {
            transform: scale(0.9);
        }

        /* Nút Add lớn góc phải dưới */
        .btn-fab {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 70px;
            height: 70px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-fab:active { transform: scale(0.95); }

        /* Ghi chú chân trang */
        .footer-note {
            font-size: 18px;
            font-weight: bold;
            color: #8B0000;
            padding-left: 10px;
        }
        .footer-note span {
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div class="grid-container">

            <!-- SIDEBAR TRÁI -->
            <div class="sidebar glass-panel">
                <div class="sidebar-logo">
                    <img src="ICONS/Logoicon.png" alt="Logo">
                </div>
                <div class="nav-item-dashboad" onclick="chuyentrang('Dashboard.html')" "><img src="ICONS/Dashboardicon.png" alt="icon""> DASHBOARD</div>
                <div class="nav-item-thanh-toan" onclick="chuyentrang('ThanhToan.html')"><img src="ICONS/ThanhToanicon.png" alt="icon"> THANH TOÁN</div>
                <div class="nav-item-tich-diem nav-active" onclick="chuyentrang('TichDiem.html')"><img src="ICONS/TichDiemicon.png" alt="icon"> TÍCH ĐIỂM</div>
                <div class="nav-item-nguyenlieu" onclick="chuyentrang('NguyenLieu.html')"><img src="ICONS/ingredientsicon.png" alt="icon"> NGUYÊN LIỆU</div>
                <div class="spacer"></div>
                <div class="nav-item-dangxuat" onclick="chuyentrang('KetCa.html')"><img src="ICONS/DangXuaticon.png" alt="icon"> KẾT CA</div>
            </div>

            <!-- THANH TOP BAR -->
            <div class="topbar glass-panel">
                <div class="user-info">
                    <div style="font-weight: lighter; font-size: 18px;">ID: 24521487</div>
                    <div style="font-weight: bold; font-size: 22px;">Tên: Nguyễn Phú Quốc</div>
                </div>
                <div class="btn-other" onclick="chuyentrang('Khac.html')">Khác</div>
            </div>

            <!-- BẢNG CHÍNH BÊN PHẢI (QUẢN LÝ TÍCH ĐIỂM) -->
            <div class="main-panel glass-panel">
                
                <!-- Thanh Header Bảng -->
                <div class="customer-header-bar row-grid">
                    <span>ID / SĐT</span>
                    <div class="header-search">
                        <img src="ICONS/searchicon.png" alt="Search">
                        <input type="text" id="search-input" placeholder="Nhập SĐT hoặc tên KH" oninput="renderCustomers()">
                    </div>
                    <span>Ngày tạo TK</span>
                    <span>Điểm</span>
                    <span></span> 
                </div>

                <!-- Vùng chứa danh sách -->
                <div class="customer-list-container">
                    <div class="customer-list" id="customer-container">
                        <!-- JS đổ dữ liệu -->
                    </div>
                    
                    <!-- Nút Thêm (FAB) -->
                    <img src="ICONS/Addicon.png" class="btn-fab" alt="Add">
                </div>

                <!-- Ghi chú cuối trang -->
                <div class="footer-note">
                    * Ghi chú: <span>Mua đủ 10 lần sẽ được giảm 40% cho lần mua tiếp theo</span>
                </div>

            </div>
        </div>
    </div>

    <script>
        function scaleApp() {
            const wrapper = document.getElementById('app-wrapper');
            const targetWidth = 1440;
            const targetHeight = 1080;
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const scale = Math.min(windowWidth / targetWidth, windowHeight / targetHeight);
            wrapper.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', scaleApp);
        scaleApp();

        const customersDB = [
            { phone: "07535726547", name: "Thịnh Suy", date: "25/05/2015", points: 10 },
            { phone: "03263874626", name: "Đức Lọ", date: "34/06/2024", points: 5 } 
        ];

        // Mã SVG Icon Edit
        const editIconSVG = `
            <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>`;

        function renderCustomers() {
            const container = document.getElementById('customer-container');
            const keyword = document.getElementById('search-input').value.trim().toLowerCase();
            container.innerHTML = '';
            
            const filtered = customersDB.filter(c => 
                c.phone.includes(keyword) || c.name.toLowerCase().includes(keyword)
            );

            filtered.forEach(c => {
                container.innerHTML += `
                    <div class="customer-item row-grid">
                        <span>${c.phone}</span>
                        <span class="name">${c.name}</span>
                        <span>${c.date}</span>
                        <span>${c.points}</span>
                        <div class="action-icons">
                            <img src="ICONS/viewicon.png" alt="View">
                            ${editIconSVG}
                            <img src="ICONS/Deleteicon.png" alt="Delete">
                        </div>
                    </div>
                `;
            });
        }
       function chuyentrang(trang) {
            window.javaBackend.loadTrang(trang);
        }
        renderCustomers();
    </script>
</body>
</html>
