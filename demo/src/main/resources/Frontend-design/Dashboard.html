<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>POS System - Dashboard</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap"
        rel="stylesheet"
    >

    <style>
        /* =====================================================
           RESET
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }


        /* =====================================================
           BODY
           ===================================================== */

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                url('anhnen/anhnen.png')
                no-repeat
                center center / cover;
        }


        /* =====================================================
           APP
           ===================================================== */

        #app-wrapper {
            width: 1440px;
            height: 1080px;
            position: relative;
            transform-origin: center center;

            /* Cho phép bottom section hiển thị đủ */
            overflow: visible;
        }


        /* =====================================================
           GRID
           ===================================================== */

        .grid-container {
            width: 100%;
            height: 100%;

            display: grid;

            grid-template-columns: 292px 1099px;
            grid-template-rows: 95px 874px;

            column-gap: 20px;
            row-gap: 14px;

            justify-content: center;
            align-content: center;

            grid-template-areas:
                "sidebar topbar"
                "sidebar main";

            min-width: 0;
            min-height: 0;
        }


        /* =====================================================
           GLASS
           ===================================================== */

        .glass-panel {
            background: rgba(255, 255, 255, 0.45);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 4px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
        }


        /* =====================================================
           SIDEBAR
           ===================================================== */

        .sidebar {
            grid-area: sidebar;

            width: 292px;
            height: 983px;

            padding: 40px 0 30px;

            display: flex;
            flex-direction: column;
            align-items: center;

            overflow: hidden;
        }

        .sidebar-logo {
            margin-bottom: 25px;
            flex-shrink: 0;
        }

        .sidebar-logo img {
            width: 140px;
            height: auto;
            display: block;
            object-fit: contain;
        }


        /* =====================================================
           NAVIGATION
           ===================================================== */

        .nav-item-dashboad,
        .nav-item-thanh-toan,
        .nav-item-tich-diem,
        .nav-item-nguyenlieu,
        .nav-item-dangxuat {
            width: 85%;
            height: 60px;

            margin: 8px 0;
            padding: 0 20px;

            display: flex;
            align-items: center;

            border-radius: 15px;

            font-size: 18px;
            font-weight: bold;

            color: #000;
            cursor: pointer;

            flex-shrink: 0;
            user-select: none;
        }

        .nav-item-dashboad:hover,
        .nav-item-thanh-toan:hover,
        .nav-item-tich-diem:hover,
        .nav-item-nguyenlieu:hover,
        .nav-item-dangxuat:hover {
            background: rgba(255, 255, 255, 0.65);
        }

        .nav-item-dashboad img,
        .nav-item-thanh-toan img,
        .nav-item-tich-diem img,
        .nav-item-nguyenlieu img,
        .nav-item-dangxuat img {
            width: 30px;
            height: 30px;

            margin-right: 15px;

            object-fit: contain;
            flex-shrink: 0;
        }

        .nav-active {
            background: white;
        }

        .spacer {
            flex: 1;
            min-height: 0;
        }


        /* =====================================================
           TOP BAR
           ===================================================== */

        .topbar {
            grid-area: topbar;

            width: 1099px;
            height: 95px;

            padding: 0 11px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            min-width: 0;
            overflow: hidden;
        }

        .user-info {
            width: 343px;
            height: 73px;

            padding-left: 20px;

            background: white;
            border-radius: 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            flex-shrink: 0;
            overflow: hidden;
        }

        .user-id {
            font-size: 18px;
            font-weight: 300;
            line-height: 1.3;
            white-space: nowrap;
        }

        .user-name {
            font-size: 22px;
            font-weight: bold;
            line-height: 1.3;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .time-info {
            width: 260px;
            height: 73px;

            margin-left: 35%;

            background: white;
            border-radius: 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            flex-shrink: 0;
            overflow: hidden;
        }

        .current-date {
            width: 100%;

            text-align: center;

            font-size: 18px;
            font-weight: 300;

            line-height: 1.3;
            white-space: nowrap;
        }

        .current-time {
            width: 100%;

            padding-left: 40%;

            font-size: 22px;
            font-weight: bold;

            line-height: 1.3;
            white-space: nowrap;
        }

        .btn-other {
            width: 60px;
            height: 60px;

            background: white;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 32px;
            font-weight: bold;

            cursor: pointer;
            flex-shrink: 0;

            box-shadow:
                0 4px 6px rgba(0, 0, 0, 0.1);

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .btn-other:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }


        /* =====================================================
           MAIN
           ===================================================== */

        .main-panel {
            grid-area: main;

            width: 1099px;
            height: 874px;

            padding: 10px 25px;

            display: flex;
            flex-direction: column;

            background: transparent;
            border: none;

            min-width: 0;
            min-height: 0;

            /*
             * Quan trọng:
             * Bottom section cần rộng 1090px,
             * trong khi vùng content sau padding chỉ 1049px.
             * Vì vậy không được hidden.
             */
            overflow: visible;
        }


        /* =====================================================
           GREETING
           ===================================================== */

        .greeting {
            margin: 0 0 10px 5px;

            font-family: 'Dancing Script', cursive;
            font-size: 58px;
            font-weight: 700;

            line-height: 1.1;
            color: #111;

            flex-shrink: 0;
        }


        /* =====================================================
           TOP WIDGETS
           ===================================================== */

        .top-widgets {
            width: 100%;
            height: 235px;

            display: flex;
            align-items: stretch;
            justify-content: space-between;

            gap: 20px;
            margin-bottom: 20px;

            flex-shrink: 0;
            min-width: 0;
        }

        .widget-card {
            width: 235px;
            height: 235px;

            flex: 0 0 235px;

            position: relative;

            background: white;
            border-radius: 30px;

            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.8);

            overflow: hidden;
        }


        /* =====================================================
           WEATHER
           ===================================================== */

        .weather-top {
            position: absolute;

            top: 22px;
            left: 22px;

            display: flex;
            align-items: center;

            gap: 10px;

            z-index: 5;
        }

        .weather-top img {
            width: 36px;
            height: 36px;

            object-fit: contain;
            display: block;

            background: transparent !important;
        }

        .weather-top span {
            font-size: 14px;
            font-weight: bold;

            color: #000;
            white-space: nowrap;
        }

        .weather-temp {
            position: absolute;

            left: 22px;
            bottom: 20px;

            font-size: 70px;
            font-weight: bold;

            line-height: 1;
            color: #000;
        }


        /* =====================================================
           REVENUE
           ===================================================== */

        .rev-text-area {
            position: absolute;

            top: 20px;
            left: 20px;

            z-index: 10;
        }

        .rev-labels-title {
            margin-bottom: 6px;

            font-size: 17px;
            font-weight: bold;

            color: #000;
        }

        .rev-labels {
            display: flex;
            flex-direction: column;
        }

        .rev-labels div {
            display: flex;
            align-items: center;

            margin-bottom: 4px;

            font-size: 12px;
            font-weight: 600;

            color: #555;
            white-space: nowrap;
        }

        .rev-labels .box {
            width: 12px;
            height: 12px;

            margin-right: 6px;

            border-radius: 3px;
            flex-shrink: 0;
        }

        .rev-chart-container {
            position: absolute;

            left: 50%;
            bottom: 7px;

            transform: translateX(-50%);

            width: 110px;
            height: 110px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: transparent;

            overflow: hidden;

            z-index: 1;
        }

        #revenueDoughnut {
            width: 110px !important;
            height: 110px !important;

            max-width: 110px;
            max-height: 110px;

            display: block;

            background: transparent !important;

            border: none;
            outline: none;
        }


        /* =====================================================
           GROWTH
           ===================================================== */

        .growth-text-top {
            position: absolute;

            top: 22px;
            left: 0;

            width: 100%;

            text-align: center;

            z-index: 5;
        }

        .growth-title {
            margin-bottom: 3px;

            font-size: 18px;
            font-weight: bold;

            color: #000;
        }

        .growth-subtitle {
            font-size: 12px;
            color: #777;
        }

        .growth-percent {
            position: absolute;

            left: 0;
            bottom: 25px;

            width: 100%;

            text-align: center;

            font-size: 70px;
            font-weight: bold;

            line-height: 1;
            color: #000;
        }

        .percent-symbol {
            font-size: 45px;
        }


        /* =====================================================
           CLOCK
           ===================================================== */

        .time-widget {
            background: #333;
            color: white;

            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.4);
        }

        .time-date {
            position: absolute;

            top: 22px;
            left: 0;

            width: 100%;

            text-align: center;

            font-size: 15px;
            font-weight: 500;

            color: #e0e0e0;

            white-space: nowrap;
        }

        .time-clock {
            position: absolute;

            left: 0;
            bottom: 30px;

            width: 100%;

            text-align: center;

            font-size: 52px;
            font-weight: bold;

            line-height: 1;

            white-space: nowrap;
        }

        .time-ampm {
            margin-left: 4px;

            font-size: 18px;
            font-weight: normal;
        }


        /* =====================================================
           BOTTOM
           ===================================================== */

        .bottom-widgets {
            width: 1090px;

            /*
             * Không để flex co lại.
             */
            flex: 1 0 auto;

            min-width: 1090px;
            min-height: 0;

            display: flex;

            justify-content: flex-start;
            align-items: stretch;

            gap: 20px;

            overflow: visible;
        }


        /* =====================================================
           MAIN CHART
           ===================================================== */

        .chart-container {
            width: 755px;
            height: 100%;

            flex: 0 0 755px;

            min-width: 755px;
            min-height: 0;

            padding: 22px 25px;

            display: flex;
            flex-direction: column;

            position: relative;

            overflow: hidden;

            background:
                rgba(255, 255, 255, 0.45);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            border:
                4px solid rgba(255, 255, 255, 0.7);

            border-radius: 30px;

            box-shadow:
                0 0 25px rgba(255, 255, 255, 0.6);
        }

        .chart-title {
            width: 100%;

            margin-bottom: 8px;

            font-size: 19px;
            font-weight: bold;

            line-height: 1.2;
            color: #000;

            flex-shrink: 0;

            z-index: 5;
        }

        .canvas-wrapper {
            position: relative;

            width: 100%;
            height: 100%;

            flex: 1 1 auto;

            min-width: 0;
            min-height: 0;

            display: block;

            overflow: hidden;

            border-radius: 18px;

            /*
             * Nền sáng để tránh canvas đen.
             */
            background: #f5f5f5 !important;
        }

        #weeklySalesChart {
            position: absolute;

            top: 0;
            left: 0;

            width: 100% !important;
            height: 100% !important;

            display: block;

            margin: 0;
            padding: 0;

            border: none;
            outline: none;

            background:
                #f5f5f5 !important;

            background-image: none !important;
        }


        /* =====================================================
           TOP PRODUCTS
           ===================================================== */

        .top-products-container {
            width: 315px;
            height: 100%;

            flex: 0 0 315px;

            min-width: 315px;
            min-height: 0;

            padding: 22px 18px;

            display: flex;
            flex-direction: column;

            position: relative;

            overflow: hidden;

            background: white;

            border-radius: 30px;

            box-shadow:
                0 0 25px rgba(255, 255, 255, 0.7);
        }

        .top-products-title {
            width: 100%;

            margin-bottom: 12px;

            text-align: center;

            font-size: 18px;
            font-weight: bold;

            line-height: 1.3;

            color: #000;

            flex-shrink: 0;
        }


        /* =====================================================
           PRODUCT HEADER
           ===================================================== */

        .product-header {
            width: 100%;

            padding-bottom: 8px;
            margin-bottom: 10px;

            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 10px;

            flex-shrink: 0;

            border-bottom:
                1px solid #eee;

            font-size: 13px;
            font-weight: bold;

            color: #000;
        }

        .product-header span {
            white-space: nowrap;
        }

        .product-header span:last-child {
            flex-shrink: 0;
        }


        /* =====================================================
           PRODUCT LIST
           ===================================================== */

        .product-list {
            width: 100%;

            flex: 1 1 auto;

            min-width: 0;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding-right: 5px;

            font-size: 14px;
            font-weight: 500;
        }

        .product-list::-webkit-scrollbar {
            width: 4px;
        }

        .product-list::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .product-list::-webkit-scrollbar-track {
            background: transparent;
        }


        /* =====================================================
           PRODUCT ITEM
           ===================================================== */

        .product-item {
            width: 100%;

            min-height: 22px;

            margin-bottom: 12px;

            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 8px;

            color: #222;
        }

        .product-name-wrap {
            min-width: 0;
            max-width: calc(100% - 45px);

            display: flex;
            align-items: center;

            gap: 8px;
        }

        .product-name-wrap > span:first-child {
            flex-shrink: 0;
        }

        .product-name-wrap > span:last-child {
            min-width: 0;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .product-item > span:last-child {
            flex: 0 0 auto;

            margin-left: 8px;

            font-size: 13px;

            white-space: nowrap;

            color: #222;
        }

        .color-box {
            width: 12px;
            height: 12px;

            border-radius: 3px;

            flex-shrink: 0;
        }


        /* =====================================================
           TOP PRODUCT CHART
           ===================================================== */

        .top-chart-wrapper {
            position: relative;

            width: 100%;
            height: 155px;

            flex: 0 0 155px;

            min-width: 0;
            min-height: 155px;

            margin-top: auto;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;

            background: transparent;
        }

        #topProductsDoughnut {
            position: absolute;

            top: 0;
            left: 0;

            width: 100% !important;
            height: 100% !important;

            display: block;

            background:
                transparent !important;

            border: none;
            outline: none;
        }


        /* =====================================================
           EMPTY DATA
           ===================================================== */

        .empty-data {
            width: 100%;

            padding: 20px;

            text-align: center;

            color: #777;

            font-size: 13px;
        }


        /* =====================================================
           IMAGE
           ===================================================== */

        img {
            user-select: none;

            -webkit-user-drag: none;
        }
    </style>
</head>


<body>

    <div id="app-wrapper">

        <div class="grid-container">


            <!-- =================================================
                 SIDEBAR
                 ================================================= -->

            <div class="sidebar glass-panel">

                <div class="sidebar-logo">
                    <img
                        src="ICONS/helloicon.png"
                        alt="Logo"
                        style="scale: 1.9;"
                    >
                </div>


                <div
                    class="nav-item-dashboad nav-active"
                    onclick="chuyentrang('Dashboard.html')"
                >
                    <img
                        src="ICONS/Dashboardicon.png"
                        alt="Dashboard"
                    >
                    DASHBOARD
                </div>


                <div
                    class="nav-item-thanh-toan"
                    onclick="chuyentrang('ThanhToan.html')"
                >
                    <img
                        src="ICONS/ThanhToanicon.png"
                        alt="Thanh toán"
                    >
                    THANH TOÁN
                </div>


                <div
                    class="nav-item-tich-diem"
                    onclick="chuyentrang('TichDiem.html')"
                >
                    <img
                        src="ICONS/TichDiemicon.png"
                        alt="Tích điểm"
                    >
                    TÍCH ĐIỂM
                </div>


                <div
                    class="nav-item-nguyenlieu"
                    onclick="chuyentrang('NguyenLieu.html')"
                >
                    <img
                        src="ICONS/ingredientsicon.png"
                        alt="Nguyên liệu"
                    >
                    NGUYÊN LIỆU
                </div>


                <div class="spacer"></div>


                <div
                    class="nav-item-dangxuat"
                    onclick="chuyentrang('KetCa.html')"
                >
                    <img
                        src="ICONS/DangXuaticon.png"
                        alt="Kết ca"
                    >
                    KẾT CA
                </div>

            </div>


            <!-- =================================================
                 TOP BAR
                 ================================================= -->

            <div class="topbar glass-panel">
                <div class="user-info">
                    <div style="font-weight: lighter;font-size: 18px">ID: <span id="staffid"></span></div>
                    <div style="font-weight: bold; font-size: 22px;">Tên: <span id="staffname"></span></div>
                </div>
                <div class="time-info">
                    <div style="font-weight: lighter; font-size: 18px;" id="current-date"></div>
                    <div style="font-weight: bold; font-size: 22px; margin-left: 40%;" id="current-time"></div>
                </div>
                <div class="btn-other" style="font-size: 32px;">⚙️</div>
            </div>


            <!-- =================================================
                 MAIN
                 ================================================= -->

            <div class="main-panel">


                <!-- GREETING -->

                <div class="greeting">
                    Chúc một ngày tốt lành !
                </div>


                <!-- =================================================
                     TOP WIDGETS
                     ================================================= -->

                <div class="top-widgets">


                    <!-- WEATHER -->

                    <div class="widget-card">

                        <div class="weather-top">

                            <img
                                src="ICONS/weathericon.png"
                                alt="Weather"
                            >

                            <span>
                                TP.Hồ Chí Minh
                            </span>

                        </div>


                        <div
                            class="weather-temp"
                            id="weather-temp"
                        >
                            --°C
                        </div>

                    </div>


                    <!-- REVENUE -->

                    <div class="widget-card">

                        <div class="rev-text-area">

                            <div class="rev-labels-title">
                                Doanh Thu:
                            </div>

                            <div class="rev-labels">

                                <div>
                                    <div
                                        class="box"
                                        style="background:#555"
                                    ></div>
                                    7 ngày gần nhất
                                </div>

                                <div>
                                    <div
                                        class="box"
                                        style="background:#E0E0E0"
                                    ></div>
                                    7 ngày trước đó
                                </div>

                            </div>

                        </div>


                        <div class="rev-chart-container">

                            <canvas
                                id="revenueDoughnut"
                            ></canvas>

                        </div>

                    </div>


                    <!-- GROWTH -->

                    <div class="widget-card">

                        <div class="growth-text-top">

                            <div class="growth-title">
                                Tăng Trưởng
                            </div>

                            <div class="growth-subtitle">
                                So với 7 ngày trước
                            </div>

                        </div>


                        <div class="growth-percent">

                            <span id="growth-value">
                                0
                            </span>

                            <span class="percent-symbol">
                                %
                            </span>

                        </div>

                    </div>


                    <!-- CLOCK -->

                    <div class="widget-card time-widget">

                        <div
                            class="time-date"
                            id="widget-date"
                        >
                            Loading...
                        </div>


                        <div class="time-clock">

                            <span id="widget-time">
                                --:--
                            </span>

                            <span
                                class="time-ampm"
                                id="widget-ampm"
                            ></span>

                        </div>

                    </div>

                </div>


                <!-- =================================================
                     BOTTOM
                     ================================================= -->

                <div class="bottom-widgets">


                    <!-- =================================================
                         MAIN CHART
                         ================================================= -->

                    <div class="chart-container">

                        <div class="chart-title">
                            Số lượng Bán / 7 ngày gần nhất
                        </div>


                        <div class="canvas-wrapper">

                            <canvas
                                id="weeklySalesChart"
                            ></canvas>

                        </div>

                    </div>


                    <!-- =================================================
                         TOP PRODUCTS
                         ================================================= -->

                    <div class="top-products-container">

                        <div class="top-products-title">
                            Sản phẩm bán chạy nhất
                        </div>


                        <div class="product-header">

                            <span>
                                Tên sản phẩm
                            </span>

                            <span>
                                Số lượng
                            </span>

                        </div>


                        <div
                            class="product-list"
                            id="top-product-list"
                        ></div>


                        <div class="top-chart-wrapper">

                            <canvas
                                id="topProductsDoughnut"
                            ></canvas>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script src="javascript/Dashboard.js"></script>

</body>
</html>
