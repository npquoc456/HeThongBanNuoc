<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - CAFE</title>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Arima:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0ede7;
            background-image: url('anhnen/anhnen.png');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: 100% 100vh;
            background-position: center center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }


        .login-container {
            display: flex;
            background: white;
            border-radius: 41px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            width: 1177px;
            height: 777px;
            position: relative;
            z-index: 1;
        }

        .login-image {
            flex: 1;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
            border-radius: 41px 0 0 41px;
            width: 600px;
            height: 777px;
        }

        .login-image img {
            width: 600px;
            height: 777px;
            object-fit: cover;
            border-radius: 41px 0 0 41px;
            box-shadow: none;
        }

        .login-form-section {
            display: grid;
            grid-template-rows: auto 2fr;
            grid-template-columns: 1fr;
            gap: 0;
            padding: 20px 40px 60px 40px;
            position: relative;
            width: 577px;
            height: 777px;
            overflow-y: auto;
        }

        .logo-section {
            grid-row: 1;
            grid-column: 1;
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-section img {
            height: 160px;
            width: 160px;
            margin-bottom: 5px;
        }

        .form-content {
            grid-row: 2;
            grid-column: 1;
            display: grid;
            grid-template-rows: auto auto auto;
            grid-template-columns: 1fr;
            gap: 0;
            width: 100%;
        }

        .form-header {
            grid-row: 1;
            grid-column: 1;
            margin-bottom: 20px;
            width: 100%;
        }

        .form-header h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .form-header p {
            font-size: 28px;
            color: #999;
            margin-bottom: 20px;
        }

        .welcome-text {
            font-size: 150%;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.3;
            font-family: 'Architects Daughter', cursive;
            font-weight: 400;
            text-align: center;
            width: 100%;
        }

        #login-form {
            grid-row: 2;
            grid-column: 1;
            display: grid;
            grid-template-rows: auto auto;
            grid-template-columns: 1fr;
            gap: 0;
            width: 100%;
            margin-top: -70px;
        }

        .form-group {
            grid-column: 1;
            margin-bottom: 25px;
            width: 100%;
        }

        .form-group:nth-child(1) {
            grid-row: 1;
        }

        .form-group:nth-child(2) {
            grid-row: 2;
        }

        .login-btn {
            grid-row: 3;
            grid-column: 1;
            width: auto;
            padding: 12px 40px;
            background: #555555;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 24px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            justify-self: center;
            font-family: 'Arima', sans-serif;
        }

        .form-group label {
            display: block;
            font-size: 22px;
            font-weight: 700;
            color: #333;
            margin-bottom: 12px;
            font-family: 'Arima', sans-serif;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #d9d9d9;
            border-radius: 19px;
            font-size: 20px;
            transition: all 0.3s ease;
            font-family: 'Arima', sans-serif;
            background-color: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #999;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .form-group input::placeholder {
            color: #ccc;
            font-family: 'Arima', sans-serif;
            font-size: 24px;
        }

        .login-btn:hover {
            background: #444444;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                min-height: auto;
            }

            .login-image {
                min-height: 300px;
                border-radius: 20px 20px 0 0;
            }

            .login-form-section {
                padding: 40px 30px;
                min-height: auto;
            }

            .logo-section {
                position: static;
                text-align: center;
                margin-bottom: 20px;
            }

            .form-header {
                margin-top: 0;
            }

            .welcome-text {
                font-size: 14px;
                margin-bottom: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Left Side - Image -->
        <div class="login-image">
            <img id="coffee-image" src="anhnen/anhminhhoa.jpg" alt="Iced Coffee">
        </div>

        <!-- Right Side - Form -->
        <div class="login-form-section">
            <!-- Logo -->
            <div class="logo-section">
                <img id="cafe-logo" src="anhnen/LOGO.png" alt="CAFE Logo"> 
            </div>

            <!-- Form Content -->
            <div class="form-content">
                <div class="form-header">
                    <p class="welcome-text">Welcome back, Please login<br>your account !!</p>
                </div>

                <form id="login-form">
                    <!-- User ID Input -->
                    <div class="form-group">
                        <label for="user-id-input">ID của bạn:</label>
                        <input 
                            type="text" 
                            id="user-id-input" 
                            name="user-id" 
                            placeholder="Nhập id của bạn"
                            required
                        >
                    </div>

                    <!-- Password Input -->
                    <div class="form-group">
                        <label for="password-input">Mật khẩu của bạn:</label>
                        <input 
                            type="password" 
                            id="password-input" 
                            name="password" 
                            placeholder="Nhập mật khẩu của bạn"
                            required
                        >
                    </div>

                    <!-- Login Button -->
                    <button type="submit" id="login-btn" class="login-btn">ĐĂNG NHẬP</button>
                </form>
            </div>
        </div>
    </div>

<script>

const loginForm = document.getElementById("login-form");
const userIdInput = document.getElementById("user-id-input");
const passwordInput = document.getElementById("password-input");
const loginButton = document.getElementById("login-btn");

loginForm.addEventListener("submit", function (e) {

    e.preventDefault();

    const userId = userIdInput.value.trim();
    const password = passwordInput.value;

    if (userId === "") {
        hienThiLoi("Vui lòng nhập ID.");
        return;
    }

    if (password === "") {
        hienThiLoi("Vui lòng nhập mật khẩu.");
        return;
    }

    loginButton.disabled = true;
    //change nut dang nhap
    loginButton.innerText = "ĐANG ĐĂNG NHẬP...";


if (window.javaBackend) {
        try {
            let dangNhapDung = window.javaBackend.xuLyDangNhap(userId, password);
            
            if (dangNhapDung) {
                //dk dung
                window.javaBackend.loadTrang("ThanhToan.html"); 
            }

        } catch (e) {
            console.error(e);
            hienThiLoi("Không thể kết nối tới Java.");
        }
    } else {
        hienThiLoi("Không tìm thấy JavaFX Backend.");
    }
    
    loginButton.disabled = false;
    loginButton.innerText = "ĐĂNG NHẬP";
});

function hienThiLoi(thongBao) {
    alert(thongBao);
    passwordInput.value = "";
    passwordInput.focus();
}

</script>
</body>
</html>
